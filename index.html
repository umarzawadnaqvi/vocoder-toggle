<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Singer Vocoder V4</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #050505; color: #00ffcc; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #video-container { position: relative; width: 80%; max-width: 300px; border: 2px solid #00ffcc; border-radius: 10px; overflow: hidden; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        #status { margin: 15px; font-size: 1.4rem; font-weight: bold; }
        button { padding: 20px 40px; font-size: 1.2rem; background: #00ffcc; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
        .controls { color: #666; font-size: 0.8rem; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>VOCODER V4</h1>
    <div id="status">OFFLINE</div>
    <div id="video-container"><video id="input_video" playsinline></video></div>
    <div class="controls">Open Hand: Vocoder | Closed: Raw Voice</div>
    <br>
    <button id="startBtn">START SYSTEM</button>

    <script>
        const videoElement = document.getElementById('input_video');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');

        let audioCtx, vocoderGain, bypassGain, oscillators = [];

        startBtn.onclick = async () => {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                videoElement.srcObject = stream;
                const micSource = audioCtx.createMediaStreamSource(stream);

                // 1. Create a "FAT" Carrier (3 oscillators for a richer sound)
                const freqs = [110, 110.5, 109.5]; // Slightly detuned for thickness
                const carrierMixer = audioCtx.createGain();
                freqs.forEach(f => {
                    const osc = audioCtx.createOscillator();
                    osc.type = 'sawtooth';
                    osc.frequency.value = f;
                    osc.start();
                    osc.connect(carrierMixer);
                    oscillators.push(osc);
                });

                // 2. Vocoder & Bypass Nodes
                vocoderGain = audioCtx.createGain();
                vocoderGain.gain.value = 0;
                
                bypassGain = audioCtx.createGain();
                bypassGain.gain.value = 0.5; // Raw voice starts audible

                // 3. Simple 4-Band Filter Bank
                const bands = [300, 800, 1500, 3000];
                bands.forEach(freq => {
                    const mFilter = audioCtx.createBiquadFilter();
                    mFilter.type = 'bandpass'; mFilter.frequency.value = freq; mFilter.Q.value = 1;
                    
                    const cFilter = audioCtx.createBiquadFilter();
                    cFilter.type = 'bandpass'; cFilter.frequency.value = freq; cFilter.Q.value = 1;

                    const env = audioCtx.createGain();
                    env.gain.value = 0;

                    micSource.connect(mFilter);
                    mFilter.connect(env.gain); // Voice shapes the volume

                    carrierMixer.connect(cFilter);
                    cFilter.connect(env);
                    env.connect(vocoderGain);
                });

                // 4. Connect Everything to Output
                micSource.connect(bypassGain);
                bypassGain.connect(audioCtx.destination);
                vocoderGain.connect(audioCtx.destination);

                // 5. MediaPipe
                const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
                hands.setOptions({ maxNumHands: 1, modelComplexity: 1 });
                hands.onResults((res) => {
                    if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                        const open = res.multiHandLandmarks[0][8].y < res.multiHandLandmarks[0][6].y;
                        const now = audioCtx.currentTime;
                        if (open) {
                            vocoderGain.gain.setTargetAtTime(2.5, now, 0.05); // Boosted Vocoder
                            bypassGain.gain.setTargetAtTime(0, now, 0.05);   // Mute Raw
                            statusDiv.innerText = "MODE: VOCODER";
                            statusDiv.style.color = "#00ffcc";
                        } else {
                            vocoderGain.gain.setTargetAtTime(0, now, 0.05);   // Mute Vocoder
                            bypassGain.gain.setTargetAtTime(0.7, now, 0.05); // Show Raw
                            statusDiv.innerText = "MODE: RAW VOICE";
                            statusDiv.style.color = "#ffffff";
                        }
                    }
                });

                new Camera(videoElement, {
                    onFrame: async () => { await hands.send({image: videoElement}); },
                    width: 640, height: 480
                }).start();

                startBtn.style.display = 'none';
            } catch (e) { alert(e.message); }
        };
    </script>
</body>
</html>

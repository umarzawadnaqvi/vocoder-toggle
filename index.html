<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Major Gesture Vocoder</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #050505; color: #00ffcc; font-family: 'Courier New', monospace; text-align: center; }
        #video-container { position: relative; width: 320px; height: 240px; margin: 10px auto; border: 2px solid #333; border-radius: 10px; overflow: hidden; }
        video { width: 100%; transform: scaleX(-1); }
        #status { font-size: 1.5rem; font-weight: bold; margin: 10px; min-height: 1.6em; }
        button { padding: 15px 30px; font-size: 1rem; background: #00ffcc; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>CHORD VOCODER</h1>
    <div id="status">READY</div>
    <div id="video-container"><video id="input_video" playsinline></video></div>
    <button id="startBtn">ACTIVATE SYSTEM</button>

    <script>
        const videoElement = document.getElementById('input_video');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');

        let audioCtx, vocoderGain, oscillators = [];
        const CHORDS = {
            1: [146.83, 185.00, 220.00], // D Major (D3, F#3, A3)
            2: [164.81, 196.00, 246.94], // E Minor (E3, G3, B3)
            3: [185.00, 220.00, 277.18], // F# Minor (F#3, A3, C#4)
            4: [196.00, 246.94, 293.66], // G Major (G3, B3, D4)
            5: [220.00, 277.18, 329.63]  // A Major (A3, C#4, E4)
        };

        startBtn.onclick = async () => {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            videoElement.srcObject = stream;
            const micSource = audioCtx.createMediaStreamSource(stream);

            // 1. Setup Carriers
            const carrierMixer = audioCtx.createGain();
            [0, 1, 2].forEach(i => {
                const osc = audioCtx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.value = 0; // Starts silent
                osc.start();
                osc.connect(carrierMixer);
                oscillators.push(osc);
            });

            // 2. Clearer 6-Band Vocoder Bank
            vocoderGain = audioCtx.createGain();
            vocoderGain.gain.value = 0;
            const bands = [250, 500, 1000, 2000, 4000, 8000];
            bands.forEach(freq => {
                const mF = audioCtx.createBiquadFilter(); mF.type = 'bandpass'; mF.frequency.value = freq; mF.Q.value = 2;
                const cF = audioCtx.createBiquadFilter(); cF.type = 'bandpass'; cF.frequency.value = freq; cF.Q.value = 2;
                const env = audioCtx.createGain(); env.gain.value = 0;

                micSource.connect(mF);
                mF.connect(env.gain);
                carrierMixer.connect(cF);
                cF.connect(env);
                env.connect(vocoderGain);
            });

            vocoderGain.connect(audioCtx.destination);

            // 3. Hand Logic
            const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7 });

            hands.onResults((res) => {
                if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
                    const lm = res.multiHandLandmarks[0];
                    // Finger counting logic (checking if tip is above knuckle)
                    const fingers = [8, 12, 16, 20].filter(i => lm[i].y < lm[i-2].y).length;
                    const thumb = lm[4].x < lm[3].x ? 1 : 0; // Simple thumb check
                    const count = fingers + thumb;

                    if (count > 0 && CHORDS[count]) {
                        const now = audioCtx.currentTime;
                        CHORDS[count].forEach((f, i) => {
                            oscillators[i].frequency.setTargetAtTime(f, now, 0.03);
                        });
                        vocoderGain.gain.setTargetAtTime(1.5, now, 0.05);
                        statusDiv.innerText = `CHORD: ${count} FINGERS`;
                    } else {
                        vocoderGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                        statusDiv.innerText = "MUTED (CLOSED)";
                    }
                }
            });

            new Camera(videoElement, { onFrame: async () => await hands.send({image: videoElement}) }).start();
            startBtn.style.display = 'none';
        };
    </script>
</body>
</html>

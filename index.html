<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Vocoder Control</title>
    
    <!-- Load MediaPipe and Tone.js Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #0f0f0f; 
            color: #00ffcc; 
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        #video-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            border: 2px solid #333;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
        }
        video {
            width: 100%;
            display: block;
            transform: scaleX(-1); /* Mirror effect */
        }
        #status {
            margin: 20px 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button {
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: bold;
            background: #00ffcc;
            color: #000;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }
        button:active { transform: scale(0.95); }
        #debug-log {
            font-size: 10px;
            color: #666;
            margin-top: 20px;
            max-width: 80%;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>VOCODER V1</h1>
    
    <div id="status">System: Waiting</div>

    <div id="video-container">
        <video id="input_video"></video>
    </div>

    <button id="startBtn">INITIALIZE SYSTEM</button>

    <div id="debug-log">Log: Ready...</div>

    <script>
        const videoElement = document.getElementById('input_video');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const debugLog = document.getElementById('debug-log');

        function log(msg) {
            console.log(msg);
            debugLog.innerText += "\n> " + msg;
        }

        let vocoder, synth, mic;

        startBtn.onclick = async () => {
            log("Attempting to start audio...");
            try {
                // 1. Start Tone.js (Unlock Mobile Audio)
                await Tone.start();
                log("Tone.js context started.");

                // 2. Setup Vocoder
                vocoder = new Tone.Vocoder().toDestination();
                mic = new Tone.UserMedia();
                // Carrier is a simple robotic sawtooth synth
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sawtooth" }
                }).connect(vocoder.carrier);

                // 3. Open Mic
                await mic.open();
                mic.connect(vocoder);
                log("Microphone connected.");

                // 4. Setup Hands
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults((results) => {
                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        const hand = results.multiHandLandmarks[0];
                        // landmark 8 is index tip, 6 is index knuckle
                        const isOpen = hand[8].y < hand[6].y;

                        if (isOpen) {
                            synth.triggerAttack("C3"); // Hold a C3 note
                            statusDiv.innerText = "VOCODER: ACTIVE";
                            statusDiv.style.color = "#00ffcc";
                        } else {
                            synth.releaseAll();
                            statusDiv.innerText = "VOCODER: MUTED";
                            statusDiv.style.color = "#ff4444";
                        }
                    }
                });

                // 5. Start Camera
                const camera = new Camera(videoElement, {
                    onFrame: async () => {
                        await hands.send({image: videoElement});
                    },
                    width: 640,
                    height: 480
                });

                log("Requesting camera...");
                await camera.start();
                log("Camera active.");

                startBtn.style.display = 'none';
                statusDiv.innerText = "SYSTEM ONLINE";

            } catch (err) {
                log("FATAL ERROR: " + err.message);
                statusDiv.innerText = "ERROR - Check Log";
                statusDiv.style.color = "red";
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hand Toggle System</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #0f0f0f; color: #00ffcc; font-family: monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #video-container { position: relative; width: 90%; max-width: 400px; border: 2px solid #333; border-radius: 15px; overflow: hidden; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        #status { margin: 20px 0; font-size: 1.2rem; }
        button { padding: 15px 30px; font-size: 1rem; background: #00ffcc; border: none; border-radius: 50px; cursor: pointer; }
        #debug-log { font-size: 10px; color: #666; margin-top: 20px; width: 80%; text-align: left; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>SYSTEM V2</h1>
    <div id="status">STATUS: STANDBY</div>
    <div id="video-container"><video id="input_video"></video></div>
    <button id="startBtn">START SYSTEM</button>
    <div id="debug-log">Log: Initialized</div>

    <script>
        const videoElement = document.getElementById('input_video');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const debugLog = document.getElementById('debug-log');

        function log(msg) { debugLog.innerText += "\n> " + msg; }

        let audioCtx, micStream, gainNode;

        startBtn.onclick = async () => {
            log("Starting...");
            try {
                // 1. Audio Setup (Standard Web Audio)
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0; // Start muted
                
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                const source = audioCtx.createMediaStreamSource(stream);
                
                source.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                videoElement.srcObject = stream;
                log("Mic & Camera hardware linked.");

                // 2. MediaPipe Setup
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({ maxNumHands: 1, modelComplexity: 1 });

                hands.onResults((results) => {
                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        const hand = results.multiHandLandmarks[0];
                        // landmark 8 (tip) vs 6 (knuckle)
                        const isOpen = hand[8].y < hand[6].y;

                        if (isOpen) {
                            gainNode.gain.setTargetAtTime(1, audioCtx.currentTime, 0.05);
                            statusDiv.innerText = "AUDIO: OPEN";
                            statusDiv.style.color = "#00ffcc";
                        } else {
                            gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.05);
                            statusDiv.innerText = "AUDIO: MUTED";
                            statusDiv.style.color = "#ff4444";
                        }
                    }
                });

                const camera = new Camera(videoElement, {
                    onFrame: async () => { await hands.send({image: videoElement}); },
                    width: 640, height: 480
                });

                await camera.start();
                log("Processing frames...");
                startBtn.style.display = 'none';

            } catch (err) {
                log("ERROR: " + err.message);
            }
        };
    </script>
</body>
</html>

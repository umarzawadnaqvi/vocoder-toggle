<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Air Canvas AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
        #controls { position: absolute; top: 10px; left: 10px; z-index: 10; color: white; pointer-events: none; }
        #video-container { position: absolute; bottom: 10px; right: 10px; width: 120px; border: 1px solid #444; border-radius: 8px; overflow: hidden; transform: scaleX(-1); }
        video { width: 100%; display: block; }
        canvas { position: absolute; top: 0; left: 0; touch-action: none; transform: scaleX(-1); }
        button { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 15px 30px; border-radius: 30px; border: none; background: #00ffcc; font-weight: bold; z-index: 20; }
    </style>
</head>
<body>

    <div id="controls">
        <h2 id="mode-status">Waiting for Start...</h2>
        <p>Pinch Index + Thumb to Draw</p>
    </div>

    <canvas id="paint_canvas"></canvas>
    <div id="video-container"><video id="input_video" playsinline></video></div>
    
    <button id="startBtn">START CANVAS</button>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('paint_canvas');
        const ctx = canvasElement.getContext('2d');
        const status = document.getElementById('mode-status');
        const startBtn = document.getElementById('startBtn');

        let lastX = 0, lastY = 0;
        let isDrawing = false;

        // Resize canvas to fill screen
        function resize() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
        }
        window.addEventListener('resize', resize);
        resize();

        function getDistance(p1, p2) {
            return Math.hypot(p1.x - p2.x, p1.y - p2.y);
        }

        startBtn.onclick = () => {
            startBtn.style.display = 'none';
            status.innerText = "Initializing AI...";
            setupAI();
        };

        function setupAI() {
            const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.8 });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    const indexTip = lm[8];
                    const thumbTip = lm[4];
                    
                    // Map normalized coordinates (0-1) to screen pixels
                    const x = indexTip.x * canvasElement.width;
                    const y = indexTip.y * canvasElement.height;

                    // Pinch logic: if distance between thumb and index is small
                    const distance = getDistance(indexTip, thumbTip);
                    
                    if (distance < 0.05) { // PINCHED
                        if (!isDrawing) {
                            isDrawing = true;
                            lastX = x;
                            lastY = y;
                        }
                        ctx.beginPath();
                        ctx.moveTo(lastX, lastY);
                        ctx.lineTo(x, y);
                        ctx.stroke();
                        status.innerText = "✏️ DRAWING";
                        status.style.color = "#00ffcc";
                    } else { // RELEASED
                        isDrawing = false;
                        status.innerText = "✋ MOVING (No Ink)";
                        status.style.color = "#ffffff";
                    }

                    // Clear Screen Logic: If all 5 fingers are up
                    const fingersUp = [8, 12, 16, 20].filter(i => lm[i].y < lm[i-2].y).length;
                    if (fingersUp === 4 && distance > 0.1) {
                        ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                    }

                    lastX = x;
                    lastY = y;
                }
            });

            new Camera(videoElement, {
                onFrame: async () => { await hands.send({image: videoElement}); },
                width: 640, height: 480
            }).start();
        }
    </script>
</body>
</html>

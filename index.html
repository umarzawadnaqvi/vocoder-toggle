<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Hand Vocoder</title>
    
    <!-- Load MediaPipe and the latest STABLE Tone.js -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>

    <style>
        body { margin: 0; background: #1a1a1a; color: #00ffcc; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        #video-container { position: relative; width: 80%; max-width: 350px; border: 3px solid #00ffcc; border-radius: 20px; overflow: hidden; box-shadow: 0 0 20px #00ffcc55; }
        video { width: 100%; display: block; transform: scaleX(-1); }
        #status { margin: 20px 0; font-size: 1.5rem; font-weight: bold; text-shadow: 0 0 10px #00ffcc; }
        button { padding: 20px 40px; font-size: 1.2rem; background: #00ffcc; border: none; border-radius: 50px; cursor: pointer; color: #000; font-weight: bold; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 30px #fff; }
        #debug-log { font-size: 10px; color: #555; margin-top: 20px; width: 80%; height: 60px; overflow-y: auto; text-align: left; border-top: 1px solid #333; }
    </style>
</head>
<body>
    <h1>VOCODER PRO</h1>
    <div id="status">STATUS: OFFLINE</div>
    <div id="video-container"><video id="input_video" playsinline></video></div>
    <br>
    <button id="startBtn">ACTIVATE VOCODER</button>
    <div id="debug-log">Log: Awaiting Start...</div>

    <script>
        const videoElement = document.getElementById('input_video');
        const statusDiv = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const debugLog = document.getElementById('debug-log');

        function log(msg) { debugLog.innerText += "\n> " + msg; debugLog.scrollTop = debugLog.scrollHeight; }

        let vocoder, synth, mic;

        startBtn.onclick = async () => {
            log("Loading Tone.js Engine...");
            try {
                await Tone.start();
                log("Audio Context Started.");

                // 1. Setup high-quality Vocoder
                vocoder = new Tone.Vocoder({
                    highPolyphony: true,
                    resonance: 0.5
                }).toDestination();

                // 2. Setup the "Carrier" (The Synth Sound)
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "sawtooth" },
                    envelope: { attack: 0.05, release: 0.2 }
                }).connect(vocoder.carrier);

                // 3. Setup the "Modulator" (Your Mic)
                mic = new Tone.UserMedia();
                await mic.open();
                mic.connect(vocoder);
                log("Microphone connected.");

                // 4. MediaPipe AI Logic
                const hands = new Hands({
                    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
                });

                hands.setOptions({ maxNumHands: 1, modelComplexity: 1 });

                hands.onResults((results) => {
                    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                        const hand = results.multiHandLandmarks[0];
                        const isOpen = hand[8].y < hand[6].y;

                        if (isOpen) {
                            // Play a rich chord for the vocoder to "shape"
                            synth.triggerAttack(["C3", "G3", "C4"], Tone.now());
                            statusDiv.innerText = "VOCODER: ACTIVE";
                            statusDiv.style.color = "#00ffcc";
                        } else {
                            synth.releaseAll();
                            statusDiv.innerText = "VOCODER: MUTED";
                            statusDiv.style.color = "#ff4444";
                        }
                    }
                });

                // 5. Camera Setup
                const camera = new Camera(videoElement, {
                    onFrame: async () => { await hands.send({image: videoElement}); },
                    width: 640, height: 480
                });

                await camera.start();
                log("System online and tracking.");
                startBtn.style.display = 'none';

            } catch (err) {
                log("FATAL ERROR: " + err.message);
                console.error(err);
            }
        };
    </script>
</body>
</html>
